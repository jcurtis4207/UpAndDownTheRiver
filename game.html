<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Up And Down The River</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
        <link rel="manifest" href="/icons/site.webmanifest">
        <link rel="preload" href="/styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
        <noscript><link rel="stylesheet" href="/styles.css"></noscript>
    </head>
    <body>
        <div id="game-container">
            <div class="all-players"></div>
            <div class="active-suits"></div>
            <div class="active-players"></div>
            <div class="pot"></div>
            <div class="input"></div>
            <div class="inventory"></div>
            <div class="message"></div>
        </div>
        <button type="button" id="cleanup-button" hidden>Delete Game</button>
        <button type="button" id="score-button">View Score Sheet</button>
        <script type="module" src="/js/app.js" defer></script>
    </body>
</html>
