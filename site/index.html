<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Up And Down The River</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
        <link rel="manifest" href="/icons/site.webmanifest">
        <link rel="preload" href="/css/generic-style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
        <noscript><link rel="stylesheet" href="/css/generic-style.css"></noscript>
    </head>
    <body>
        <div id="login">
            <div class="header">
                <h1>Up and Down the River</h1>
                <h2>Login</h2>
            </div>
            <form>
                <div class="group">
                    <label>Email</label>
                    <input id="txtEmail" type="email">
                </div>
                <div class="group">
                    <label>Password</label>
                    <input id="txtPassword" type="password">
                </div>
                <div class="group">
                    <label title="The name that will appear in the game">Display Name</label>
                    <input id="txtUsername" type="text" title="The name that will appear in the game" maxlength="20">
                </div>
                <p id="login-error" class="error-message" role="alert" hidden></p>
                <button id="btnLogin" type="button">Log in</button>
            </form>
        </div>
        <script type="module" src="/js/login.js" defer></script>
    </body>
</html>
